<!DOCTYPE html>
<html lang="tr">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Snaply</title>

        <link
                rel="stylesheet"
                href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        >

        <style>
                body {
                        margin: 0;
                        font-family: "Wanted Sans", sans-serif;
                        background-color: #f9f9f9;
                }

                @font-face {
                        font-family: "Wanted Sans";
                        src: url("/fonts/WantedSans.woff") format("woff");
                        font-weight: normal;
                        font-style: normal;
                }

                /* Header */

                header {
                        position: fixed;
                        top: 0;
                        left: 0;
                        width: 100%;
                        height: 60px;
                        background-color: #fff;
                        display: flex;
                        align-items: center;
                        justify-content: space-between;
                        padding: 0 20px;
                        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
                        z-index: 1000;
                        box-sizing: border-box;
                }

                header > img {
                        width: 99px;
                        margin: 0;
                }

                header nav {
                        display: flex;
                        align-items: center;
                }

                header nav a {
                        margin-left: 20px;
                        text-decoration: none;
                        color: #333;
                        font-weight: bold;
                        margin-right: 30px;
                }

                .header-right {
                        display: flex;
                        align-items: center;
                        margin-right: 40px;
                }

                #profilePhoto {
                        width: 40px;
                        height: 40px;
                        border-radius: 50%;
                        object-fit: cover;
                        cursor: pointer;
                        border: 2px solid #eee;
                        transition: 0.2s;
                }

                #profilePhoto:hover {
                        transform: scale(1.05);
                        border-color: #ccc;
                }

                /* Sidebar */

                aside {
                        position: fixed;
                        top: 60px;
                        left: 0;
                        width: 200px;
                        height: calc(100% - 60px);
                        background-color: #fff;
                        box-shadow: 2px 0 5px rgba(0,0,0,0.1);
                        padding-top: 20px;
                        z-index: 900;
                }

                aside a {
                        display: block;
                        padding: 10px 20px;
                        color: #333;
                        text-decoration: none;
                }

                aside a:hover {
                        background-color: #f0f0f0;
                }

                /* Main */

                main {
                        margin-left: 200px;
                        padding-top: 80px;
                        padding-left: 20px;
                        padding-right: 20px;
                        max-width: 1000px;
                }

                /* Loading */

                .loading {
                        width: 100%;
                        min-height: calc(100vh - 100px);
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        box-sizing: border-box;
                }

                .loader {
                        border: 4px solid rgba(0, 0, 0, .1);
                        border-left-color: transparent;
                        width: 36px;
                        height: 36px;
                        border-radius: 50%;
                        animation: spin89345 1s linear infinite;
                }

                @keyframes spin89345 {
                        0% {
                                transform: rotate(0deg);
                        }

                        100% {
                                transform: rotate(360deg);
                        }
                }

                /* Video */

                .watch-video {
                        width: 100%;
                        background-color: #000;
                        border-radius: 10px;
                        overflow: hidden;
                        position: relative;
                }

                #videoPlayer {
                        width: 100%;
                        max-height: 650px;
                        display: block;
                        background-color: #000;
                        cursor: pointer;
                }

                /* Tam ekran */

                .watch-video:fullscreen {
                        width: 100vw;
                        height: 100vh;
                        border-radius: 0;
                        background-color: #000;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                }

                .watch-video:fullscreen #videoPlayer {
                        width: 100%;
                        height: 100%;
                        max-height: none;
                        object-fit: contain;
                }

                /* Custom Controls */

                .video-controls {
                        position: absolute;
                        left: 0;
                        right: 0;
                        bottom: 0;
                        padding: 10px 12px;
                        background: linear-gradient(
                                transparent,
                                rgba(0,0,0,0.85)
                        );
                        opacity: 0;
                        visibility: hidden;
                        transform: translateY(5px);
                        transition:
                                opacity 0.25s ease,
                                transform 0.25s ease,
                                visibility 0.25s ease;
                        box-sizing: border-box;
                        z-index: 10;
                }

                .watch-video:hover .video-controls,
                .watch-video.controls-visible .video-controls {
                        opacity: 1;
                        visibility: visible;
                        transform: translateY(0);
                }

                /* Tam ekranda otomatik gizlenme */

                .watch-video.fullscreen-controls-hidden .video-controls {
                        opacity: 0;
                        visibility: hidden;
                        transform: translateY(8px);
                        pointer-events: none;
                }

                .watch-video.fullscreen-controls-hidden {
                        cursor: none;
                }

                .watch-video.fullscreen-controls-hidden #videoPlayer {
                        cursor: none;
                }

                /* Progress */

                .progress-container {
                        width: 100%;
                        height: 5px;
                        margin-bottom: 10px;
                        cursor: pointer;
                        background-color: rgba(255,255,255,0.35);
                        border-radius: 10px;
                }

                #progressBar {
                        width: 0%;
                        height: 100%;
                        background-color: #fff;
                        border-radius: 10px;
                        pointer-events: none;
                }

                .control-row {
                        display: flex;
                        align-items: center;
                        gap: 10px;
                }

                .control-button {
                        border: none;
                        background: transparent;
                        color: #fff;
                        font-size: 18px;
                        cursor: pointer;
                        padding: 4px 6px;
                        font-family: inherit;
                        width: 32px;
                        height: 32px;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                }

                .control-button:hover {
                        opacity: 0.7;
                }

                .time-display {
                        color: #fff;
                        font-size: 13px;
                        user-select: none;
                }

                .control-spacer {
                        flex: 1;
                }

                /* Video Details */

                .video-details {
                        margin-top: 15px;
                        background-color: #fff;
                        border-radius: 10px;
                        padding: 20px;
                        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
                }

                .video-title {
                        margin: 0 0 18px 0;
                        font-size: 24px;
                        color: #222;
                        font-weight: bold;
                        line-height: 1.3;
                }

                /* Meta */

                .video-meta {
                        display: flex;
                        align-items: center;
                        justify-content: space-between;
                        gap: 20px;
                        padding-bottom: 18px;
                        border-bottom: 1px solid #eee;
                }

                /* Channel */

                .channel-info {
                        display: flex;
                        align-items: center;
                        gap: 12px;
                }

                .author-photo {
                        width: 45px;
                        height: 45px;
                        border-radius: 50%;
                        object-fit: cover;
                        border: 1px solid #eee;
                }

                .video-author {
                        margin: 0;
                        color: #222;
                        font-size: 15px;
                        font-weight: bold;
                }

                .video-views {
                        margin-top: 4px;
                        color: #888;
                        font-size: 13px;
                }

                /* Actions */

                .video-actions {
                        display: flex;
                        gap: 8px;
                }

                .video-actions button {
                        border: none;
                        background-color: #f1f1f1;
                        padding: 10px 16px;
                        border-radius: 20px;
                        cursor: pointer;
                        font-family: inherit;
                        font-weight: bold;
                        transition: 0.2s;
                }

                .video-actions button:hover {
                        background-color: #e5e5e5;
                }

                .video-actions button.active {
                        background-color: #ddd;
                }

                .video-actions button i {
                        font-size: 16px;
                }

                #likeCount {
                        margin-left: 0px;
                }

                #likeCount:not(:empty) {
                        margin-left: 6px;
                }

                /* Description */

                .video-description-box {
                        margin-top: 18px;
                        background-color: #f2f2f2;
                        border-radius: 10px;
                        padding: 15px;
                }

                .video-description-box p {
                        margin: 0;
                        color: #333;
                        font-size: 14px;
                        line-height: 1.6;
                        white-space: pre-wrap;
                }

                /* Error */

                .error-message {
                        background-color: #fff;
                        padding: 40px;
                        text-align: center;
                        border-radius: 10px;
                        color: #d33;
                        white-space: pre-wrap;
                        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
                }

                /* Mobile */

                @media (max-width: 800px) {

                        aside {
                                display: none;
                        }

                        main {
                                margin-left: 0;
                                padding-left: 10px;
                                padding-right: 10px;
                        }

                        header nav {
                                display: none;
                        }

                        .header-right {
                                margin-left: auto;
                                margin-right: 20px;
                        }

                        .video-title {
                                font-size: 20px;
                        }

                        .video-meta {
                                align-items: flex-start;
                                flex-direction: column;
                        }

                        .video-actions {
                                width: 100%;
                        }

                        .video-actions button {
                                flex: 1;
                        }
                }
        </style>
</head>

<body>

        <!-- Header -->

        <header>

                <img
                        src="../images/SnaplyText.png"
                        alt="Snaply"
                >

                <nav>
                        <a href="../">Ana Sayfa</a>
                        <a href="#">Popüler</a>
                        <a href="#">Abonelikler</a>
                </nav>

                <div class="header-right">

                        <img
                                id="profilePhoto"
                                src="../images/default-avatar.png"
                                alt="Profil"
                        >

                </div>

        </header>


        <!-- Sidebar -->

        <aside>

                <a href="../">Ana Sayfa</a>
                <a href="#">Trendler</a>
                <a href="#">Abonelikler</a>
                <a href="#">Kitaplık</a>
                <a href="#">Geçmiş</a>

        </aside>


        <!-- Main -->

        <main>

                <!-- Loading -->

                <div
                        id="loading"
                        class="loading"
                >
                        <div class="loader"></div>
                </div>


                <!-- Video Content -->

                <div
                        id="videoContent"
                        style="display: none;"
                >

                        <!-- Video -->

                        <div
                                class="watch-video"
                                id="watchVideo"
                        >

                                <video
                                        id="videoPlayer"
                                        playsinline
                                        preload="metadata"
                                ></video>


                                <!-- Custom Controls -->

                                <div class="video-controls">

                                        <div
                                                class="progress-container"
                                                id="progressContainer"
                                        >
                                                <div
                                                        id="progressBar"
                                                ></div>
                                        </div>


                                        <div class="control-row">

                                                <!-- Play -->

                                                <button
                                                        id="playButton"
                                                        class="control-button"
                                                        type="button"
                                                        aria-label="Oynat"
                                                >
                                                        <i
                                                                class="fa-solid fa-play"
                                                        ></i>
                                                </button>


                                                <!-- Time -->

                                                <span
                                                        id="timeDisplay"
                                                        class="time-display"
                                                >
                                                        0:00 / 0:00
                                                </span>


                                                <div
                                                        class="control-spacer"
                                                ></div>


                                                <!-- Volume -->

                                                <button
                                                        id="muteButton"
                                                        class="control-button"
                                                        type="button"
                                                        aria-label="Sesi kapat"
                                                >
                                                        <i
                                                                class="fa-solid fa-volume-high"
                                                        ></i>
                                                </button>


                                                <!-- Fullscreen -->

                                                <button
                                                        id="fullscreenButton"
                                                        class="control-button"
                                                        type="button"
                                                        aria-label="Tam ekran"
                                                >
                                                        <i
                                                                class="fa-solid fa-expand"
                                                        ></i>
                                                </button>

                                        </div>

                                </div>

                        </div>


                        <!-- Video Details -->

                        <div class="video-details">

                                <h1
                                        id="videoTitle"
                                        class="video-title"
                                ></h1>


                                <div class="video-meta">

                                        <div class="channel-info">

                                                <img
                                                        id="authorPhoto"
                                                        src="../images/default-avatar.png"
                                                        alt="Kullanıcı"
                                                        class="author-photo"
                                                >

                                                <div>

                                                        <div
                                                                id="videoAuthor"
                                                                class="video-author"
                                                        >
                                                                Kullanıcı
                                                        </div>

                                                        <div
                                                                id="videoViews"
                                                                class="video-views"
                                                        >
                                                                0 izlenme
                                                        </div>

                                                </div>

                                        </div>


                                        <div class="video-actions">

                                                <button
                                                        id="likeButton"
                                                        type="button"
                                                        aria-label="Beğen"
                                                >
                                                        <i
                                                                id="likeIcon"
                                                                class="fa-regular fa-thumbs-up"
                                                        ></i>

                                                        <span
                                                                id="likeCount"
                                                        ></span>
                                                </button>

                                                <button
                                                        id="shareButton"
                                                        type="button"
                                                >
                                                        <i class="fa-solid fa-share"></i>
                                                </button>

                                        </div>

                                </div>


                                <!-- Description -->

                                <div class="video-description-box">

                                        <p
                                                id="videoDescription"
                                        ></p>

                                </div>

                        </div>

                </div>


                <!-- Error -->

                <div
                        id="error"
                        class="error-message"
                        style="display: none;"
                >
                        Video bulunamadı.
                </div>

        </main>


        <!-- Firebase -->

        <script type="module">

                import { auth, db } from "../firebase.js";

                import {
                        onAuthStateChanged
                } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

                import {
                        doc,
                        getDoc,
                        updateDoc,
                        increment,
                        collection,
                        getDocs,
                        setDoc,
                        deleteDoc
                } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


                const videoPlayer =
                        document.getElementById("videoPlayer");

                const watchVideo =
                        document.getElementById("watchVideo");

                const playButton =
                        document.getElementById("playButton");

                const muteButton =
                        document.getElementById("muteButton");

                const fullscreenButton =
                        document.getElementById("fullscreenButton");

                const progressContainer =
                        document.getElementById("progressContainer");

                const progressBar =
                        document.getElementById("progressBar");

                const timeDisplay =
                        document.getElementById("timeDisplay");

                const videoTitle =
                        document.getElementById("videoTitle");

                const videoAuthor =
                        document.getElementById("videoAuthor");

                const videoViews =
                        document.getElementById("videoViews");

                const videoDescription =
                        document.getElementById("videoDescription");

                const profilePhoto =
                        document.getElementById("profilePhoto");

                const authorPhoto =
                        document.getElementById("authorPhoto");

                const loading =
                        document.getElementById("loading");

                const videoContent =
                        document.getElementById("videoContent");

                const errorElement =
                        document.getElementById("error");

                const likeButton =
                        document.getElementById("likeButton");

                const likeIcon =
                        document.getElementById("likeIcon");

                const likeCount =
                        document.getElementById("likeCount");

                const shareButton =
                        document.getElementById("shareButton");


                let viewCounted = false;

                let fullscreenTimer = null;

                let currentLikeCount = 0;

                let currentUser = null;

                let videoLoaded = false;


                /*
                 * URL'den video ID
                 */

                const params =
                        new URLSearchParams(
                                window.location.search
                        );

                const videoId =
                        params.get("id");


                /*
                 * Font Awesome ikonlarını değiştir
                 */

                function setIcon(
                        element,
                        iconClass
                ) {

                        element.innerHTML =
                                `<i class="fa-solid ${iconClass}"></i>`;

                }


                /*
                 * Profil fotoğrafı
                 */

                onAuthStateChanged(
                        auth,
                        async (user) => {

                                currentUser = user;

                                if (!user) {
                                        return;
                                }

                                try {

                                        const userSnapshot =
                                                await getDoc(
                                                        doc(
                                                                db,
                                                                "users",
                                                                user.uid
                                                        )
                                                );

                                        if (!userSnapshot.exists()) {
                                                return;
                                        }

                                        const userData =
                                                userSnapshot.data();

                                        if (userData.photoURL) {

                                                profilePhoto.src =
                                                        new URL(
                                                                userData.photoURL,
                                                                window.location.origin
                                                        ).href;

                                        }

                                        if (videoLoaded) {
                                                await checkLikeStatus();
                                        }

                                }
                                catch (error) {

                                        console.error(
                                                "Profil fotoğrafı alınamadı:",
                                                error
                                        );

                                }

                        }
                );


                /*
                 * Video ID kontrolü
                 */

                if (!videoId) {

                        showError(
                                "Video ID bulunamadı."
                        );

                }
                else {

                        loadVideo(videoId);

                }


                /*
                 * Videoyu getir
                 */

                async function loadVideo(id) {

                        try {

                                const videoSnapshot =
                                        await getDoc(
                                                doc(
                                                        db,
                                                        "videos",
                                                        id
                                                )
                                        );


                                if (!videoSnapshot.exists()) {

                                        showError(
                                                "Video bulunamadı."
                                        );

                                        return;

                                }


                                const data =
                                        videoSnapshot.data();


                                /*
                                 * BAN KONTROLÜ
                                 */

                                if (
                                        String(
                                                data.status || ""
                                        ).toLowerCase() === "banned"
                                ) {

                                        showError(
                                                "Bu video " +
                                                (
                                                        data.banreason ||
                                                        "bilinmeyen sebep"
                                                ) +
                                                " sebebiyle yasaklandı."
                                        );

                                        return;

                                }


                                /*
                                 * Public kontrolü
                                 */

                                if (
                                        data.visibility &&
                                        data.visibility !== "public"
                                ) {

                                        showError(
                                                "Bu video herkese açık değil."
                                        );

                                        return;

                                }


                                /*
                                 * Video URL kontrolü
                                 */

                                if (!data.videoURL) {

                                        showError(
                                                "Video dosyası bulunamadı."
                                        );

                                        return;

                                }


                                /*
                                 * Başlık
                                 */

                                videoTitle.textContent =
                                        data.title ||
                                        "Başlıksız video";


                                /*
                                 * İzlenme
                                 */

                                const views =
                                        Number(
                                                data.views || 0
                                        );

                                videoViews.textContent =
                                        views +
                                        " izlenme";


                                /*
                                 * Açıklama
                                 */

                                videoDescription.textContent =
                                        data.description ||
                                        "Bu videonun açıklaması yok.";


                                /*
                                 * Video URL
                                 */

                                videoPlayer.src =
                                        data.videoURL;


                                /*
                                 * Thumbnail
                                 */

                                if (data.thumbnailURL) {

                                        videoPlayer.poster =
                                                data.thumbnailURL;

                                }


                                /*
                                 * Video sahibini getir
                                 */

                                if (data.authorUID) {

                                        try {

                                                const authorSnapshot =
                                                        await getDoc(
                                                                doc(
                                                                        db,
                                                                        "users",
                                                                        data.authorUID
                                                                )
                                                        );


                                                if (
                                                        authorSnapshot.exists()
                                                ) {

                                                        const authorData =
                                                                authorSnapshot.data();


                                                        /*
                                                         * Profil fotoğrafı
                                                         */

                                                        if (
                                                                authorData.photoURL
                                                        ) {

                                                                authorPhoto.src =
                                                                        new URL(
                                                                                authorData.photoURL,
                                                                                window.location.origin
                                                                        ).href;

                                                        }


                                                        /*
                                                         * Kullanıcı adı
                                                         */

                                                        if (
                                                                authorData.publicusername
                                                        ) {

                                                                videoAuthor.textContent =
                                                                        "@" +
                                                                        authorData.publicusername;

                                                        }
                                                        else if (
                                                                authorData.username
                                                        ) {

                                                                videoAuthor.textContent =
                                                                        authorData.username;

                                                        }
                                                        else {

                                                                videoAuthor.textContent =
                                                                        "Kullanıcı";

                                                        }

                                                }

                                        }
                                        catch (authorError) {

                                                console.error(
                                                        "Video sahibi alınamadı:",
                                                        authorError
                                                );

                                        }

                                }


                                /*
                                 * Video hazır
                                 */

                                videoPlayer.load();

                                videoLoaded = true;

                                if (currentUser) {
                                        await checkLikeStatus();
                                }

                                loading.style.display =
                                        "none";

                                videoContent.style.display =
                                        "block";

                        }
                        catch (error) {

                                console.error(
                                        "Video yüklenirken hata:",
                                        error
                                );

                                showError(
                                        "Video yüklenirken bir hata oluştu."
                                );

                        }

                }


                /*
                 * Play / Pause
                 */

                playButton.addEventListener(
                        "click",
                        () => {

                                if (videoPlayer.paused) {

                                        videoPlayer.play();

                                }
                                else {

                                        videoPlayer.pause();

                                }

                        }
                );


                videoPlayer.addEventListener(
                        "play",
                        () => {

                                setIcon(
                                        playButton,
                                        "fa-pause"
                                );

                        }
                );


                videoPlayer.addEventListener(
                        "pause",
                        () => {

                                setIcon(
                                        playButton,
                                        "fa-play"
                                );

                        }
                );


                /*
                 * Süre formatı
                 */

                function formatTime(seconds) {

                        if (!Number.isFinite(seconds)) {
                                return "0:00";
                        }

                        const minutes =
                                Math.floor(
                                        seconds / 60
                                );

                        const secs =
                                Math.floor(
                                        seconds % 60
                                )
                                .toString()
                                .padStart(2, "0");

                        return minutes +
                                ":" +
                                secs;

                }


                /*
                 * Progress bar
                 */

                videoPlayer.addEventListener(
                        "timeupdate",
                        () => {

                                if (!videoPlayer.duration) {
                                        return;
                                }

                                const percentage =
                                        (
                                                videoPlayer.currentTime /
                                                videoPlayer.duration
                                        ) *
                                        100;

                                progressBar.style.width =
                                        percentage + "%";


                                timeDisplay.textContent =
                                        formatTime(
                                                videoPlayer.currentTime
                                        ) +
                                        " / " +
                                        formatTime(
                                                videoPlayer.duration
                                        );

                        }
                );


                /*
                 * Video süresi hazır
                 */

                videoPlayer.addEventListener(
                        "loadedmetadata",
                        () => {

                                timeDisplay.textContent =
                                        "0:00 / " +
                                        formatTime(
                                                videoPlayer.duration
                                        );

                        }
                );


                /*
                 * Progress bar'a tıklama
                 */

                progressContainer.addEventListener(
                        "click",
                        (event) => {

                                if (!videoPlayer.duration) {
                                        return;
                                }

                                const rect =
                                        progressContainer.getBoundingClientRect();

                                const position =
                                        (
                                                event.clientX -
                                                rect.left
                                        ) /
                                        rect.width;

                                videoPlayer.currentTime =
                                        position *
                                        videoPlayer.duration;

                        }
                );


                /*
                 * Ses
                 */

                muteButton.addEventListener(
                        "click",
                        () => {

                                videoPlayer.muted =
                                        !videoPlayer.muted;

                                updateMuteIcon();

                        }
                );


                function updateMuteIcon() {

                        if (
                                videoPlayer.muted ||
                                videoPlayer.volume === 0
                        ) {

                                setIcon(
                                        muteButton,
                                        "fa-volume-xmark"
                                );

                                muteButton.setAttribute(
                                        "aria-label",
                                        "Sesi aç"
                                );

                        }
                        else {

                                setIcon(
                                        muteButton,
                                        "fa-volume-high"
                                );

                                muteButton.setAttribute(
                                        "aria-label",
                                        "Sesi kapat"
                                );

                        }

                }


                /*
                 * Tam ekran
                 */

                fullscreenButton.addEventListener(
                        "click",
                        async () => {

                                try {

                                        if (
                                                document.fullscreenElement
                                        ) {

                                                await document.exitFullscreen();

                                        }
                                        else {

                                                await watchVideo.requestFullscreen();

                                        }

                                }
                                catch (error) {

                                        console.error(
                                                "Tam ekran açılamadı:",
                                                error
                                        );

                                }

                        }
                );


                /*
                 * Tam ekran ikonunu güncelle
                 */

                document.addEventListener(
                        "fullscreenchange",
                        () => {

                                if (
                                        document.fullscreenElement ===
                                        watchVideo
                                ) {

                                        setIcon(
                                                fullscreenButton,
                                                "fa-compress"
                                        );

                                        startFullscreenControlsTimer();

                                }
                                else {

                                        setIcon(
                                                fullscreenButton,
                                                "fa-expand"
                                        );

                                        clearFullscreenControlsTimer();

                                        watchVideo.classList.remove(
                                                "fullscreen-controls-hidden"
                                        );

                                        watchVideo.classList.add(
                                                "controls-visible"
                                        );

                                }

                        }
                );


                /*
                 * Tam ekranda kontrolleri göster
                 */

                function showFullscreenControls() {

                        if (
                                document.fullscreenElement !==
                                watchVideo
                        ) {
                                return;
                        }

                        watchVideo.classList.remove(
                                "fullscreen-controls-hidden"
                        );

                        watchVideo.classList.add(
                                "controls-visible"
                        );


                        clearTimeout(
                                fullscreenTimer
                        );


                        fullscreenTimer =
                                setTimeout(
                                        () => {

                                                if (
                                                        document.fullscreenElement ===
                                                        watchVideo &&
                                                        !videoPlayer.paused
                                                ) {

                                                        watchVideo.classList.add(
                                                                "fullscreen-controls-hidden"
                                                        );

                                                }

                                        },
                                        2000
                                );

                }


                /*
                 * Timer başlat
                 */

                function startFullscreenControlsTimer() {

                        showFullscreenControls();

                }


                /*
                 * Timer temizle
                 */

                function clearFullscreenControlsTimer() {

                        clearTimeout(
                                fullscreenTimer
                        );

                        fullscreenTimer =
                                null;

                }


                /*
                 * Tam ekranda mouse hareketi
                 */

                watchVideo.addEventListener(
                        "mousemove",
                        () => {

                                if (
                                        document.fullscreenElement ===
                                        watchVideo
                                ) {

                                        showFullscreenControls();

                                }

                        }
                );


                /*
                 * Tam ekranda mouse hareketi
                 * touch cihazlar için
                 */

                watchVideo.addEventListener(
                        "touchstart",
                        () => {

                                if (
                                        document.fullscreenElement ===
                                        watchVideo
                                ) {

                                        showFullscreenControls();

                                }

                        }
                );


                /*
                 * Video üzerine tıklayınca
                 * play / pause
                 */

                videoPlayer.addEventListener(
                        "click",
                        () => {

                                if (videoPlayer.paused) {

                                        videoPlayer.play();

                                }
                                else {

                                        videoPlayer.pause();

                                }

                                if (
                                        document.fullscreenElement ===
                                        watchVideo
                                ) {

                                        showFullscreenControls();

                                }

                        }
                );


                /*
                 * Video durunca kontroller
                 * görünür kalsın
                 */

                videoPlayer.addEventListener(
                        "pause",
                        () => {

                                if (
                                        document.fullscreenElement ===
                                        watchVideo
                                ) {

                                        clearFullscreenControlsTimer();

                                        watchVideo.classList.remove(
                                                "fullscreen-controls-hidden"
                                        );

                                        watchVideo.classList.add(
                                                "controls-visible"
                                        );

                                }

                        }
                );


                /*
                 * Video tekrar oynayınca
                 * timer başlasın
                 */

                videoPlayer.addEventListener(
                        "play",
                        () => {

                                if (
                                        document.fullscreenElement ===
                                        watchVideo
                                ) {

                                        showFullscreenControls();

                                }

                        }
                );


                /*
                 * Klavye kontrolleri
                 */

                document.addEventListener(
                        "keydown",
                        (event) => {

                                if (
                                        document.activeElement.tagName ===
                                        "INPUT"
                                ) {
                                        return;
                                }


                                /*
                                 * Space
                                 */

                                if (
                                        event.code ===
                                        "Space"
                                ) {

                                        event.preventDefault();

                                        if (
                                                videoPlayer.paused
                                        ) {

                                                videoPlayer.play();

                                        }
                                        else {

                                                videoPlayer.pause();

                                        }

                                }


                                /*
                                 * Sağa 5 saniye
                                 */

                                if (
                                        event.code ===
                                        "ArrowRight"
                                ) {

                                        videoPlayer.currentTime +=
                                                5;

                                }


                                /*
                                 * Sola 5 saniye
                                 */

                                if (
                                        event.code ===
                                        "ArrowLeft"
                                ) {

                                        videoPlayer.currentTime -=
                                                5;

                                }


                                /*
                                 * M = mute
                                 */

                                if (
                                        event.code ===
                                        "KeyM"
                                ) {

                                        videoPlayer.muted =
                                                !videoPlayer.muted;

                                        updateMuteIcon();

                                }


                                /*
                                 * F = fullscreen
                                 */

                                if (
                                        event.code ===
                                        "KeyF"
                                ) {

                                        fullscreenButton.click();

                                }


                                /*
                                 * Tam ekranda klavye kullanıldıysa
                                 * kontrolleri göster
                                 */

                                if (
                                        document.fullscreenElement ===
                                        watchVideo
                                ) {

                                        showFullscreenControls();

                                }

                        }
                );


                /*
                 * İzlenme sayacı
                 */

                videoPlayer.addEventListener(
                        "timeupdate",
                        async () => {

                                if (viewCounted) {
                                        return;
                                }

                                if (
                                        videoPlayer.currentTime >=
                                        1
                                ) {

                                        viewCounted =
                                                true;

                                        try {

                                                await updateDoc(
                                                        doc(
                                                                db,
                                                                "videos",
                                                                videoId
                                                        ),
                                                        {
                                                                views:
                                                                        increment(1)
                                                        }
                                                );


                                                const currentViews =
                                                        dataViewCount();


                                                videoViews.textContent =
                                                        (
                                                                currentViews +
                                                                1
                                                        ) +
                                                        " izlenme";

                                        }
                                        catch (error) {

                                                console.error(
                                                        "İzlenme güncellenemedi:",
                                                        error
                                                );

                                                viewCounted =
                                                        false;

                                        }

                                }

                        }
                );


                function dataViewCount() {

                        const text =
                                videoViews.textContent
                                        .replace(
                                                "izlenme",
                                                ""
                                        )
                                        .trim();

                        return parseInt(
                                text
                        ) || 0;

                }


                /*
                 * Beğeni sayısını göster
                 */

                function updateLikeCountDisplay(count) {

                        currentLikeCount =
                                Math.max(
                                        0,
                                        Number(count) || 0
                                );

                        if (currentLikeCount > 0) {

                                likeCount.textContent =
                                        currentLikeCount;

                                likeCount.style.display =
                                        "inline";

                        }
                        else {

                                likeCount.textContent =
                                        "";

                                likeCount.style.display =
                                        "none";

                        }

                }


                /*
                 * Kullanıcının beğeni durumunu kontrol et
                 */

                async function checkLikeStatus() {

                        if (
                                !videoId ||
                                !currentUser
                        ) {
                                return;
                        }

                        try {

                                const likeSnapshot =
                                        await getDoc(
                                                doc(
                                                        db,
                                                        "videos",
                                                        videoId,
                                                        "likes",
                                                        currentUser.uid
                                                )
                                        );

                                if (likeSnapshot.exists()) {

                                        likeButton.classList.add(
                                                "active"
                                        );

                                        likeIcon.className =
                                                "fa-solid fa-thumbs-up";

                                }
                                else {

                                        likeButton.classList.remove(
                                                "active"
                                        );

                                        likeIcon.className =
                                                "fa-regular fa-thumbs-up";

                                }

                                const likesSnapshot =
                                        await getDocs(
                                                collection(
                                                        db,
                                                        "videos",
                                                        videoId,
                                                        "likes"
                                                )
                                        );

                                updateLikeCountDisplay(
                                        likesSnapshot.size
                                );

                        }
                        catch (error) {

                                console.warn(
                                        "Beğeni durumu alınamadı."
                                );

                        }

                }


                /*
                 * Beğen / beğeniyi kaldır
                 */

                likeButton.addEventListener(
                        "click",
                        async () => {

                                if (!currentUser) {

                                        return;

                                }

                                if (!videoId) {

                                        return;

                                }

                                likeButton.disabled =
                                        true;

                                try {

                                        const likeReference =
                                                doc(
                                                        db,
                                                        "videos",
                                                        videoId,
                                                        "likes",
                                                        currentUser.uid
                                                );

                                        const likeSnapshot =
                                                await getDoc(
                                                        likeReference
                                                );

                                        if (
                                                likeSnapshot.exists()
                                        ) {

                                                await deleteDoc(
                                                        likeReference
                                                );

                                                likeButton.classList.remove(
                                                        "active"
                                                );

                                                likeIcon.className =
                                                        "fa-regular fa-thumbs-up";

                                                updateLikeCountDisplay(
                                                        currentLikeCount - 1
                                                );

                                        }
                                        else {

                                                await setDoc(
                                                        likeReference,
                                                        {
                                                                uid:
                                                                        currentUser.uid
                                                        }
                                                );

                                                likeButton.classList.add(
                                                        "active"
                                                );

                                                likeIcon.className =
                                                        "fa-solid fa-thumbs-up";

                                                updateLikeCountDisplay(
                                                        currentLikeCount + 1
                                                );

                                        }

                                }
                                catch (error) {

                                        console.error(
                                                "Beğeni güncellenemedi:",
                                                error
                                        );

                                }
                                finally {

                                        likeButton.disabled =
                                                false;

                                }

                        }
                );


                /*
                 * Paylaş
                 */

                shareButton.addEventListener(
                        "click",
                        async () => {

                                const url =
                                        window.location.href;

                                try {

                                        await navigator.clipboard.writeText(
                                                url
                                        );

                                        shareButton.innerHTML =
                                                '<i class="fa-solid fa-check"></i>';

                                        setTimeout(
                                                () => {

                                                        shareButton.innerHTML =
                                                                '<i class="fa-solid fa-share"></i>';

                                                },
                                                2000
                                        );

                                }
                                catch (error) {

                                        console.error(
                                                "Link kopyalanamadı:",
                                                error
                                        );

                                }

                        }
                );


                /*
                 * Hata göster
                 */

                function showError(message) {

                        loading.style.display =
                                "none";

                        videoContent.style.display =
                                "none";

                        errorElement.textContent =
                                message;

                        errorElement.style.display =
                                "block";

                }

        </script>

</body>
</html>
