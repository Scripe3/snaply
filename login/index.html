<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Giriş Yap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-box">
    <img src="../images/SnaplyText.png" alt="Logo">
    <h2>Giriş Yap</h2>
    <p>Snaply'i kullanmaya devam etmek için giriş yapın. Giriş yapınca bu tarayıcıda her zaman giriş yapılmış bir şekilde Snaply kullanabileceksiniz.</p>
    <form id="loginForm">
      <input type="email" name="email" placeholder="E-Posta" autocomplete="off" id="email">
      <input type="password" name="password" placeholder="Şifre" id="password">
      <button type="submit" id="submit">Giriş Yap</button>
    </form>
    <a href="#">Kullanıcı adınızı mı unuttunuz?</a>
    <a href="#">Şifrenizi mi unuttunuz?</a>
    <a href="/snaply/signup">Hesabın yok mu?</a>

    <script type="module" src="script.js"></script>
  </div>
</body>
</html>
